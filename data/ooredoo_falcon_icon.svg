<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ooredoo Falcon Icon">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0D0D1A"/>
      <stop offset="100%" stop-color="#1E1032"/>
    </linearGradient>
    <radialGradient id="ired" cx="80%" cy="20%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#E10A0A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E10A0A" stop-opacity="0"/>
    </radialGradient>
    <filter id="ig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iw" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iclip"><rect width="200" height="200" rx="22"/></clipPath>
    <linearGradient id="ibody" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FF2828"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <g clip-path="url(#iclip)">
    <rect width="200" height="200" fill="url(#ibg)"/>
    <rect width="200" height="200" fill="url(#ired)"/>
  </g>

  <!-- ── Fibre lines from body hub (100, 105) ── -->
  <!-- Left wing -->
  <line x1="100" y1="105" x2="24"  y2="60"  stroke="#E10A0A" stroke-width="2.0" opacity="0.55"/>
  <line x1="84"  y1="96"  x2="34"  y2="75"  stroke="#E10A0A" stroke-width="1.1" opacity="0.28"/>
  <!-- Right wing -->
  <line x1="100" y1="105" x2="176" y2="130" stroke="#E10A0A" stroke-width="2.0" opacity="0.55"/>
  <line x1="116" y1="102" x2="168" y2="120" stroke="#E10A0A" stroke-width="1.1" opacity="0.28"/>
  <!-- Spine -->
  <line x1="100" y1="78"  x2="100" y2="155" stroke="#E10A0A" stroke-width="1.8" opacity="0.42"/>
  <!-- Neck to head -->
  <line x1="100" y1="78"  x2="124" y2="44"  stroke="#E10A0A" stroke-width="1.7" opacity="0.48"/>
  <!-- Tail fan -->
  <line x1="100" y1="155" x2="72"  y2="182" stroke="#E10A0A" stroke-width="1.5" opacity="0.45"/>
  <line x1="100" y1="155" x2="88"  y2="184" stroke="#E10A0A" stroke-width="1.3" opacity="0.32"/>
  <line x1="100" y1="155" x2="100" y2="185" stroke="#E10A0A" stroke-width="1.3" opacity="0.30"/>
  <line x1="100" y1="155" x2="112" y2="184" stroke="#E10A0A" stroke-width="1.3" opacity="0.32"/>
  <line x1="100" y1="155" x2="128" y2="182" stroke="#E10A0A" stroke-width="1.5" opacity="0.45"/>

  <!-- Body outline -->
  <path d="M 100 78
           C  82 80,  68 93,  68 108
           C  68 123,  81 143, 100 155
           C 119 143, 132 123, 132 108
           C 132 93, 118 80, 100 78 Z"
        fill="url(#ibody)" opacity="0.13"/>
  <path d="M 100 78
           C  82 80,  68 93,  68 108
           C  68 123,  81 143, 100 155
           C 119 143, 132 123, 132 108
           C 132 93, 118 80, 100 78 Z"
        fill="none" stroke="#E10A0A" stroke-width="1.8" opacity="0.7"/>

  <!-- Wing surfaces -->
  <path d="M 100 103 L 24 60 L 46 86 Z"  fill="#E10A0A" opacity="0.07"/>
  <path d="M 100 103 L 24 60 L 46 86 Z"  fill="none" stroke="#E10A0A" stroke-width="1.1" opacity="0.35"/>
  <path d="M 100 103 L 176 130 L 154 108 Z" fill="#E10A0A" opacity="0.07"/>
  <path d="M 100 103 L 176 130 L 154 108 Z" fill="none" stroke="#E10A0A" stroke-width="1.1" opacity="0.35"/>

  <!-- Head -->
  <ellipse cx="122" cy="46" rx="20" ry="23" fill="#12102A" stroke="#E10A0A" stroke-width="2.2" opacity="0.95"/>

  <!-- Crest feather -->
  <path d="M 117 26 L 112 16 L 120 28" fill="none" stroke="#E10A0A" stroke-width="1.6" opacity="0.72"/>
  <path d="M 124 23 L 122 14 L 128 26" fill="none" stroke="#E10A0A" stroke-width="1.3" opacity="0.50"/>

  <!-- Beak -->
  <path d="M 138 50 L 158 55 L 139 61 Z" fill="#E10A0A"/>

  <!-- Eye -->
  <circle cx="124" cy="44" r="7"  fill="#0D0D1A"/>
  <circle cx="124" cy="44" r="4.5" fill="#E10A0A" opacity="0.22"/>
  <circle cx="124" cy="44" r="3"  fill="white" filter="url(#iw)"/>
  <circle cx="124" cy="44" r="1.2" fill="#E10A0A"/>

  <!-- ─── Network nodes ─── -->
  <!-- Body hub -->
  <circle cx="100" cy="105" r="10"  fill="#E10A0A" opacity="0.12"/>
  <circle cx="100" cy="105" r="6.5" fill="#E10A0A" filter="url(#ig)" opacity="0.9"/>
  <circle cx="100" cy="105" r="3"   fill="white"/>

  <!-- Neck node -->
  <circle cx="100" cy="78"  r="4"  fill="#E10A0A" filter="url(#ig)" opacity="0.85"/>
  <circle cx="100" cy="78"  r="1.8" fill="white" opacity="0.75"/>

  <!-- Left wing-tip -->
  <circle cx="24"  cy="60"  r="7"  fill="#E10A0A" opacity="0.14"/>
  <circle cx="24"  cy="60"  r="4.5" fill="#E10A0A" filter="url(#ig)" opacity="0.85"/>
  <circle cx="24"  cy="60"  r="2"  fill="white"  opacity="0.8"/>

  <!-- Right wing-tip -->
  <circle cx="176" cy="130" r="7"  fill="#E10A0A" opacity="0.14"/>
  <circle cx="176" cy="130" r="4.5" fill="#E10A0A" filter="url(#ig)" opacity="0.85"/>
  <circle cx="176" cy="130" r="2"  fill="white"  opacity="0.8"/>

  <!-- Tail base -->
  <circle cx="100" cy="155" r="5"  fill="#E10A0A" filter="url(#ig)" opacity="0.85"/>
  <circle cx="100" cy="155" r="2.2" fill="white" opacity="0.7"/>

  <!-- Tail tips -->
  <circle cx="72"  cy="182" r="3"  fill="#E10A0A" opacity="0.60"/>
  <circle cx="128" cy="182" r="3"  fill="#E10A0A" opacity="0.60"/>

  <!-- Inner wing nodes -->
  <circle cx="46"  cy="86"  r="3"  fill="#E10A0A" opacity="0.55"/>
  <circle cx="154" cy="108" r="3"  fill="#E10A0A" opacity="0.55"/>

  <!-- ── "OO" monogram watermark (bottom right) ── -->
  <text x="150" y="190"
        font-family="'Segoe UI','Arial Black','Helvetica',sans-serif"
        font-size="14" font-weight="900"
        fill="#E10A0A" opacity="0.35"
        letter-spacing="2">OO</text>

  <!-- Outer border with corner accents -->
  <rect width="200" height="200" rx="22"
        fill="none" stroke="#E10A0A" stroke-width="1.2" opacity="0.22"/>
  <path d="M 20 2 L 2 2 L 2 20"   fill="none" stroke="#E10A0A" stroke-width="2" opacity="0.55"/>
  <path d="M 180 2 L 198 2 L 198 20" fill="none" stroke="#E10A0A" stroke-width="2" opacity="0.55"/>
  <path d="M 2 180 L 2 198 L 20 198" fill="none" stroke="#E10A0A" stroke-width="2" opacity="0.55"/>
  <path d="M 198 180 L 198 198 L 180 198" fill="none" stroke="#E10A0A" stroke-width="2" opacity="0.55"/>
</svg>
