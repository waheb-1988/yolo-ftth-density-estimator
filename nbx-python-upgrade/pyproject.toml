[project]
name = "nbx"
version = "1.0.0"
description = "Agentic Next-Best-Action / Next-Best-Offer engine for telco (operator: FSDR), runnable with Python libraries only."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["nbx*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
